name: 'Setup Node.js'
description: 'Set up Node.js with optional npm caching'
inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'
  cache:
    description: 'Package manager to cache (npm or empty)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache || '' }}
