name: Cron — Support Retention Sweep

# Deletes support-ticket data that has outlived its reason for being kept
# (SHY-0436, SHY-0435):
#
#   - tickets CLOSED more than seven days ago, taking their attachments with
#     them — the operator's number, 2026-08-22;
#   - stored attachments no ticket references and that are older than the
#     grace window: bytes uploaded the moment a file was PICKED, by somebody
#     who then backed out and never sent.
#
# Support tickets carry more personal data than almost anything else in
# ShyTalk: free text somebody wrote while upset, screenshots of private
# conversations, photographs and video OF OTHER PEOPLE, and account or payment
# details they were asked to evidence. Keeping that after the reason for
# holding it has ended is exactly what storage limitation forbids — which is
# why this is scheduled rather than left for somebody to remember.
#
# The work itself lives in `express-api/src/cron/supportRetention.js`, and its
# decisions in `express-api/src/utils/support-retention.js` where they are
# pinned without firebase or R2 — a bug in them deletes somebody's evidence.
#
# Why: per the operator's `[[feedback-avoid-crons-prefer-event-driven]]`
# directive, in-process polling crons are an architectural concern even
# when they're $0. GH Actions on a public repo is free + unlimited, so
# moving the scheduling layer out of the long-running Node process
# costs nothing and gains: (a) a hung Express process can't silently
# skip its sweeps because the trigger is external; (b) the cron
# expression lives in-repo and is auditable in PRs; (c) one-off manual
# triggers via `workflow_dispatch` don't require SSH or PM2 surgery.
#
# Companion endpoint:
#   POST /api/system/sweep-support-retention
#   Headers: Authorization: Bearer ${{ secrets.SYSTEM_SHARED_SECRET }}
#   Body:    (empty)
#
# Deploy steps (operator action, FIRST TIME ONLY):
#   1. Generate a strong secret: `openssl rand -hex 32`
#   2. Add `SYSTEM_SHARED_SECRET` to repo secrets: `gh secret set
#      SYSTEM_SHARED_SECRET --body "<value>"`
#   3. Set the same value as the `SYSTEM_SHARED_SECRET` env var on the
#      production Express API (Oracle Cloud / PM2 ecosystem.config.js)
#   4. Restart the Express API so the new env var takes effect
#
# Failure behaviour: a 5xx fails the workflow and surfaces in the Actions UI.
# The next tick picks up whatever the failed run would have done — the sweep is
# idempotent, and a day's delay on a seven-day window is not a breach. A 409
# (a concurrent sweep is in flight) is treated as success.
#
# It must NOT fail silently. A retention sweep that reports success while doing
# nothing is how personal data quietly outlives its window, which is the whole
# thing this exists to prevent.

on:
  schedule:
    # Daily 03:30 UTC — half an hour after the account-deletion sweep, so the
    # two do not contend for Firestore and a slow one cannot 409 the other.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment (prod is the only valid choice today; dev does not run crons)'
        type: choice
        options: [prod]
        default: 'prod'

permissions:
  contents: read

jobs:
  sweep:
    name: POST /api/system/sweep-support-retention
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Invoke sweep endpoint
        env:
          API_URL: https://api.shytalk.shyden.co.uk/api/system/sweep-support-retention
          SYSTEM_SHARED_SECRET: ${{ secrets.SYSTEM_SHARED_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SYSTEM_SHARED_SECRET}" ]; then
            echo "::error::SYSTEM_SHARED_SECRET secret is not configured on this repo"
            exit 1
          fi

          # `--fail-with-body` (curl >=7.76) returns non-zero on 4xx/5xx
          # AND prints the response body so workflow logs show the
          # server's error message. Without it, curl prints nothing on
          # 5xx by default. `-sS` keeps the output quiet on success
          # but shows curl's own errors on connection failure.
          # `-w "%{http_code}"` appends the status code so we can
          # distinguish 200 from 409 (acceptable) vs other status.
          HTTP_CODE=$(curl -sS -o /tmp/sweep-response.txt -w "%{http_code}" \
            -X POST "${API_URL}" \
            -H "Authorization: Bearer ${SYSTEM_SHARED_SECRET}" \
            -H "Content-Length: 0" \
            --max-time 600)

          echo "Server status: ${HTTP_CODE}"
          echo "Server body:"
          cat /tmp/sweep-response.txt
          echo

          case "${HTTP_CODE}" in
            200)
              echo "✓ sweep completed successfully"
              ;;
            409)
              # Another sweep is already running (manual re-dispatch
              # overlapping the scheduled run, or the previous run is
              # still finishing). Treat as success — the in-flight
              # sweep will complete the work and the next scheduled
              # run picks up anything new.
              echo "✓ sweep already in flight on the server — treating as success"
              ;;
            *)
              echo "::error::sweep failed with status ${HTTP_CODE}"
              exit 1
              ;;
          esac
