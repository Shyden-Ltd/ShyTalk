name: Lint

# Per-ref concurrency: newer commit on the same PR cancels in-progress
# lint runs. Without this, an older commit's lint run holds the slot
# and the newer commit's PR Checks queue can't fire (concurrency doesn't
# propagate from caller pr-checks.yml into reusable workflows). Pinned
# by express-api/tests/scripts/reusable-workflow-concurrency.test.js.
concurrency:
  group: lint-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out'
        type: string
        required: true
      app_changed:
        description: 'Whether app files changed'
        type: boolean
        required: true
      backend_changed:
        description: 'Whether backend files changed'
        type: boolean
        required: true
      pr_body:
        description: 'PR body, used to detect [allow-large-file] markers'
        type: string
        required: false
        default: ''

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to lint (default: main)'
        type: string
        default: 'main'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install ktlint
        if: inputs.app_changed == true || github.event_name == 'workflow_dispatch'
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: Run ktlint
        if: inputs.app_changed == true || github.event_name == 'workflow_dispatch'
        run: ktlint --relative

      - name: Express lint (ESLint + Prettier)
        if: inputs.backend_changed == true || github.event_name == 'workflow_dispatch'
        run: |
          cd express-api && npm ci
          npm run lint
          npm run format:check

      - name: Gherkin lint
        if: inputs.app_changed == true || github.event_name == 'workflow_dispatch'
        run: bash .claude/hooks/check-gherkin.sh

      # actionlint embeds shellcheck; together they catch unquoted globs,
      # missing `set -euo pipefail`, `2>/dev/null || true` (SC2069), and the
      # other silent-failure shapes that gave us a 7-week TestFlight outage
      # 2026-03-12 → 2026-04-29. See feedback-larger-runners-paid.md and
      # PR #372 audit notes for the full pattern catalogue.
      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          sudo mv ./actionlint /usr/local/bin/
          actionlint --version

      - name: Run actionlint (workflow + embedded shellcheck)
        run: |
          set -euo pipefail
          # SHELLCHECK_OPTS is the documented channel for passing flags into
          # actionlint's embedded shellcheck. We exclude SC2086 (intentional
          # word-splitting on GH-managed paths like $RUNNER_TEMP) repo-wide;
          # every other rule applies normally. NOTE (SHY-0191): actionlint's
          # -shellcheck flag is NOT for flags — it names the shellcheck
          # EXECUTABLE, and a non-executable value silently DISABLES the
          # integration (exit 0, no warning). Never pass that flag here.
          SHELLCHECK_OPTS='-e SC2086' actionlint

      - name: No paid GitHub-hosted runner specs
        run: bash scripts/check-no-paid-runners.sh

      - name: Workflow concurrency groups are scoped or intentionally global
        run: bash scripts/check-workflow-concurrency-scoping.sh

      - name: Third-party GitHub Actions are SHA-pinned (supply-chain)
        run: bash scripts/check-action-shas.sh

      - name: HTML data-i18n keys all have JS translation definitions
        run: bash scripts/check-orphan-i18n-keys.sh

      - name: Every web page loads the shared language resolver (?lang= flag — SHY-0181)
        run: bash scripts/check-web-pages-have-lang-resolver.sh public

      - name: Release workflow contract (PR-flow + signed commits)
        run: bash scripts/check-release-trigger.sh

      # SHY-0108 (EPIC-0003 Phase X): ratchet guard — the in-process-double
      # debt (jest.mock / Fake*Repository / page.route) may only SHRINK.
      # Fails on any NEW double not in scripts/no-stubs-baseline.json, or a
      # stale baseline entry left behind by a migration.
      - name: No NEW in-process test doubles (EPIC-0003 ratchet)
        run: node scripts/check-no-new-stubs.js

      # SHY-0245: ratchet guard — fixed-duration waits may only SHRINK. A sleep
      # is a hard-coded guess about how fast the runner is, so it is always
      # wrong somewhere: too short and it flakes on slow hardware (telling you
      # about the machine, not the product), too long and every run pays it
      # forever. Wait on the CONDITION instead. Ratchet rather than a hard zero
      # SHY-0245 is COMPLETE: the debt reached zero on 2026-07-28, so this runs
      # in STRICT mode — any fixed-duration wait fails the build, with no
      # baseline to hide behind. The ratchet (--baseline) was scaffolding for
      # working the backlog down and is gone along with the baseline file.
      # A genuinely-necessary duration (a poll interval, a requested outage
      # length, a simulated latency) carries an inline `// sleep-ok: <reason>`;
      # an unexplained marker does NOT exempt.
      - name: No fixed-duration waits (SHY-0245, strict)
        run: bash scripts/check-no-test-sleeps.sh

      # SHY-0245: tests/** previously had NO formatting gate at all — neither
      # lint-staged nor CI covered it (only express-api/**/*.js, *.feature and
      # *.{kt,kts}). Unwatched code is where debt accumulates unseen.
      - name: Prettier — tests/ (formatting gate)
        run: npx --prefix express-api prettier --check "tests/**/*.ts"

      # SHY-0256: ratchet guard — tests that report GREEN without testing
      # anything (empty bodies, assertions reachable only behind a conditional,
      # parked and self-skipping tests) may only SHRINK. Until 2026-07-30 this
      # detector existed but nothing ran it in CI: it was invoked only by the
      # gauntlet launcher, so the ratchet it defines was never actually
      # enforced on a pull request. Exits 0 at or below the baseline.
      - name: No NEW silently-passing tests (SHY-0256 ratchet)
        run: node scripts/check-test-defects.js

      # SHY-0168 (EPIC-0006): ratchet guard — direct client→backend-service
      # access (Firestore / RTDB / Storage) may only SHRINK. Clients must go
      # through the Express API (the authz layer). Fails on any NEW direct
      # Firebase-SDK reference in shipped client code (both the Android-native
      # and the iOS-gitlive namespaces) not in scripts/direct-backend-baseline.json.
      - name: No NEW direct client→backend access (EPIC-0006 ratchet)
        run: node scripts/check-no-direct-backend.js

      # SHY-0035: reject any file >5MB added in the diff vs main. Fetch
      # origin/main explicitly because actions/checkout above checks out
      # a single ref (no main reference). The fetch is cheap (commit graph
      # only via filter, plus blob promise-on-demand for cat-file).
      # PR body is passed through ALLOW_LARGE_FILE_BODY so [allow-large-file:
      # <path> reason: ...] markers can exempt legitimate large assets per PR.
      - name: Fetch origin/main for diff base
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Large-file guard (>5MB threshold)
        # Source PR body via the explicit `pr_body` workflow_call input
        # rather than `github.event.pull_request.body`. The latter would
        # work in the `pull_request`-triggered top-level event (workflow_call
        # inherits the caller's event context), but the explicit input is
        # robust against future caller-workflow refactors (e.g. if lint.yml
        # were ever called from a non-pull_request event such as a manual
        # workflow_dispatch). Empty input → no exemptions → safe default.
        env:
          ALLOW_LARGE_FILE_BODY: ${{ inputs.pr_body }}
        run: bash scripts/check-large-files.sh --against origin/main

      # SHY user-story frontmatter validator — pinned LAST so a story-
      # validation failure cannot mask earlier actionlint / shellcheck /
      # SHA-pin / i18n / release-contract / large-file findings on the
      # same PR. See CLAUDE.md § "Agile Way of Working" for the spec the
      # validator enforces, and SHY-0001 for the rationale + DoD.
      - name: Validate SHY story frontmatter
        run: bash scripts/check-story-frontmatter.sh --scan .project/stories

      # EPIC frontmatter validator — separate step from the SHY validator
      # per SHY-0037 AC line 44 ("two `--scan` calls, not one combined").
      # Runs structural + cross-corpus checks: EPIC ID collisions, unknown
      # child SHY refs, duplicate child claims. See CLAUDE.md § "Agile Way
      # of Working" → "### EPICs" for the spec.
      - name: Validate EPIC frontmatter
        run: bash scripts/check-epic-frontmatter.sh --scan .project/stories
