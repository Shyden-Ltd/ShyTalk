name: Generate Allure Report

on:
  workflow_call:
    inputs:
      suite_name:
        description: "Test suite name (e.g. android-e2e, playwright, express, kotlin)"
        required: true
        type: string
      report_env:
        description: "Report environment (pr, deploy)"
        required: false
        type: string
        default: "pr"
      artifact_pattern:
        description: "Glob pattern for downloading allure result artifacts"
        required: false
        type: string
        default: "allure-results-*"
      max_history_runs:
        description: "Number of historical runs to retain"
        required: false
        type: number
        default: 10

  workflow_dispatch:
    inputs:
      suite_name:
        description: "Test suite name (e.g. android-e2e, playwright, express, kotlin)"
        required: true
        type: string
      report_env:
        description: "Report environment (pr, deploy)"
        required: false
        type: string
        default: "pr"
      artifact_pattern:
        description: "Glob pattern for downloading allure result artifacts"
        required: false
        type: string
        default: "allure-results-*"
      max_history_runs:
        description: "Number of historical runs to retain"
        required: false
        type: string
        default: "10"

# NO concurrency group (SHY-0298). This workflow held `gh-pages-deploy` at
# WORKFLOW level, so the lock covered its history restore and report generation
# too — minutes, not the seconds of the push. Worse, a group allows only ONE
# pending entry, so a third contender cancelled the pending second (incidents
# #568/#570). The publish action now retries against the moving tip, so no
# writer needs to exclude any other.

jobs:
  generate-report:
    # A report failure must NOT red-gate the PR (SHY-0298 Error-paths AC:
    # "a publishing failure must not be reported as a test failure").
    #
    # This job is reachable from PR Gate through
    #   gate.needs → playwright-web → playwright-tests.yml → allure-report.yml
    # and a reusable workflow's conclusion is the aggregate of its jobs,
    # RECURSIVELY. So a failed publish, a transient clone, six lost races or
    # the history cap could each fail a REQUIRED check on a PR whose tests all
    # passed. The express publisher got this treatment first; this is the same
    # defect at the second site, which is why the pin below now walks every
    # publisher reachable from the gate rather than one file.
    #
    # The TESTS still gate: they run in `test-playwright`, upstream of this.
    # Everything in this job is report generation, publication and gh-pages
    # maintenance — none of it is a statement about whether the code works.
    continue-on-error: true
    name: Generate Allure Report
    runs-on: ubuntu-latest
    # 20 (was 10): the playwright suite's gh-pages round-trip (history restore +
    # report deploy) exceeds 10 min on the large gh-pages branch and was being
    # guillotined mid-deploy. Headroom guarantee; the real perf fix (shrinking
    # gh-pages) is tracked in SHY-0128. See SHY-0127.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if report already generated for this run
        id: check-existing
        run: |
          # Check gh-pages for a metadata.json with this run ID
          EXISTING=$(curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ inputs.suite_name }}/${{ inputs.report_env }}/latest/metadata.json" 2>/dev/null | grep -o '"runId":"${{ github.run_id }}"' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Report already generated for run ${{ github.run_id }} — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all Allure results
        if: steps.check-existing.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: allure-results-all/
          merge-multiple: true

      - name: Merge environment.properties from all test suites
        if: steps.check-existing.outputs.skip != 'true'
        run: |
          MERGED="allure-results-all/environment.properties"
          : > "$MERGED"
          find allure-results-all -name environment.properties -not -path "$MERGED" | sort | while read -r f; do
            # <dir>/<suite path>/environment.properties → dot-joined suite id,
            # in pure parameter expansion (same output as the old sed chain).
            rel="${f#allure-results-all/}"
            rel="${rel%/environment.properties}"
            SUITE="${rel//\//.}"
            while IFS= read -r line; do
              # pure-bash left-trim: strip the leading-whitespace run (the
              # longest non-space-led suffix is everything after it).
              trimmed="${line#"${line%%[![:space:]]*}"}"
              [ -z "$trimmed" ] && continue
              KEY=$(echo "$trimmed" | cut -d= -f1)
              VALUE=$(echo "$trimmed" | cut -d= -f2-)
              echo "${SUITE}.${KEY}=${VALUE}" >> "$MERGED"
            done < "$f"
          done

      - name: Sanitize results (strip secrets)
        if: steps.check-existing.outputs.skip != 'true'
        run: |
          if [ -f .github/scripts/sanitize-allure.sh ]; then
            bash .github/scripts/sanitize-allure.sh allure-results-all/
          fi

      - name: Install Allure CLI
        if: steps.check-existing.outputs.skip != 'true'
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz | tar xz
          echo "$PWD/allure-2.32.0/bin" >> "$GITHUB_PATH"

      - name: Restore history from gh-pages
        if: steps.check-existing.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          # Only the trend `history/` for THIS suite/env is read (next step). A
          # sparse cone checkout skips writing every other suite's full HTML
          # report to disk — the bulk of this step's cost. (Does not reduce the
          # network fetch — `filter:` would, but it overrides sparse-checkout;
          # the fetch+deploy size is the SHY-0128 bloat concern.)
          sparse-checkout: |
            ${{ inputs.suite_name }}/${{ inputs.report_env }}/history
        # Intentional: on the first run for a new suite the gh-pages
        # branch doesn't exist yet, and a missing ref would fail the
        # whole job. The next step's `cp ... 2>/dev/null || echo "No
        # previous history (first run)"` already handles the missing
        # dir gracefully, so trend tracking just degrades to "no
        # history" for the first run, then self-heals on run 2+.
        continue-on-error: true

      - name: Copy history for trend tracking
        if: steps.check-existing.outputs.skip != 'true'
        run: |
          mkdir -p allure-results-all/history
          cp -r "gh-pages/${{ inputs.suite_name }}/${{ inputs.report_env }}/history/"* allure-results-all/history/ 2>/dev/null || echo "No previous history (first run)"

      - name: Generate Allure report
        if: steps.check-existing.outputs.skip != 'true'
        run: allure generate allure-results-all -o allure-report --clean

      - name: Archive previous run
        if: steps.check-existing.outputs.skip != 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          RUN_ID=${{ github.run_id }}
          DEST="gh-pages/${{ inputs.suite_name }}/${{ inputs.report_env }}/runs/${DATE}-run-${RUN_ID}"
          cp -r "gh-pages/${{ inputs.suite_name }}/${{ inputs.report_env }}/latest" "$DEST" 2>/dev/null || true

      - name: Prune old runs (keep last N)
        if: steps.check-existing.outputs.skip != 'true'
        run: |
          RUNS_DIR="gh-pages/${{ inputs.suite_name }}/${{ inputs.report_env }}/runs"
          if [ -d "$RUNS_DIR" ]; then
            # NUL-delimited find into a bash array (not `ls` parsing —
            # SC2012): filename-safe end to end, no GNU-only flags, same
            # ascending byte sort as before so the newest N (date-prefixed
            # names) are the ones kept.
            dirs=()
            while IFS= read -r -d '' d; do
              dirs+=("$d")
            done < <(find "$RUNS_DIR" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
            excess=$(( ${#dirs[@]} - ${{ inputs.max_history_runs }} ))
            if [ "$excess" -gt 0 ]; then
              for (( i = 0; i < excess; i++ )); do
                rm -rf -- "${dirs[i]}"
              done
            fi
            echo "Pruned old runs, kept last ${{ inputs.max_history_runs }}"
          fi

      - name: Write metadata.json
        if: steps.check-existing.outputs.skip != 'true'
        run: |
          # `grep -c` prints the count AND exits non-zero on zero matches, so the
          # old `|| echo 0` fired ON TOP of grep's own "0", yielding $'0\n0' and a
          # `$((..))` "syntax error" that failed the report job on ALL-GREEN runs
          # (SHY-0127). `VAR=$(grep ...) || VAR=0` keeps each value single-line:
          # grep's "0"/"N" on success, reset to 0 on any non-zero (zero matches
          # or missing file). set -e is not tripped — the `||` absorbs the exit.
          PASSED=$(grep -c '"status":"passed"' allure-report/data/suites.json 2>/dev/null) || PASSED=0
          FAILED=$(grep -c '"status":"failed"\|"status":"broken"' allure-report/data/suites.json 2>/dev/null) || FAILED=0
          TOTAL=$((PASSED + FAILED))
          DATE=$(date +%Y-%m-%d)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat > allure-report/metadata.json <<METAEOF
          {"passed":${PASSED},"failed":${FAILED},"total":${TOTAL},"date":"${DATE}","runUrl":"${RUN_URL}","runId":"${{ github.run_id }}","suite":"${{ inputs.suite_name }}","env":"${{ inputs.report_env }}"}
          METAEOF

      - name: Preserve history
        if: steps.check-existing.outputs.skip != 'true'
        run: |
          mkdir -p allure-report/history
          cp -r allure-report/history "gh-pages/${{ inputs.suite_name }}/${{ inputs.report_env }}/history" 2>/dev/null || true

      - name: Trim report size (remove heavy attachments)
        if: steps.check-existing.outputs.skip != 'true'
        run: |
          rm -rf allure-report/data/attachments 2>/dev/null || true
          find allure-report/data/test-cases -type f -size +100k -delete 2>/dev/null || true
          echo "Report size: $(du -sh allure-report | cut -f1)"

      - name: Deploy report to GitHub Pages
        # SHY-0298: the peaceiris invocation, the dependabot skip and the
        # empty-directory refusal all moved into the composite action, so this
        # workflow no longer carries its own copy of any of them. The
        # `check-existing` skip is this workflow's OWN concern (a rerun whose
        # report is already published) and stays here.
        #
        # Serialization is unchanged and already correct: this workflow declares
        # `concurrency: gh-pages-deploy` at WORKFLOW level, which SHY-0298
        # measured to share one queue with the job-level groups the other two
        # writers now use. Do NOT also add a job-level group here — the run
        # already holds this group, and a job waiting on a lock its own run
        # holds would never start.
        if: steps.check-existing.outputs.skip != 'true'
        uses: ./.github/actions/publish-gh-pages
        with:
          publish-dir: allure-report
          destination-dir: ${{ inputs.suite_name }}/${{ inputs.report_env }}/latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cap gh-pages history (bounded, content-identical)
        # SHY-0128 fix 2: each deploy adds a gh-pages commit and that history
        # has no value (reports are point-in-time snapshots; Pages serves only
        # the tip) — 1,771 commits had accumulated 12.75 GiB of reachable pack.
        # Past MAX_GH_PAGES_COMMITS this rebuilds the branch as ONE orphan
        # commit whose tree IS the current tip tree (omitting the parent list
        # in the createCommit call is what truncates the history), entirely
        # via the Git Data API — nothing multi-GiB is downloaded or checked
        # out.
        #
        # RACE-SAFETY (SHY-0298 R3). This step FORCE-moves the ref, and its
        # only protections used to be the workflow-level `gh-pages-deploy`
        # group plus a re-read of the tip just before the move. C3 removed that
        # group — publishers now retry instead of queueing — and a re-read is a
        # check, not a compare-and-swap: a publisher landing between the read
        # and the PATCH was silently discarded, while its own job exited 0.
        # Nothing was red; a report just vanished.
        #
        # The move is therefore done with `git push --force-with-lease`, which
        # is a genuine CAS: the SERVER refuses the update unless gh-pages is
        # still exactly $TIP. A lost race becomes a visible rejection and a
        # skipped cap, instead of a lost report. The orphan commit is still
        # built via the API — the push only needs the commit object, so a
        # shallow blob-less clone sends almost nothing.
        #
        # Same gating as the deploy step: dependabot runs hold a read-only
        # GITHUB_TOKEN and can't write.
        if: steps.check-existing.outputs.skip != 'true' && !startsWith(github.head_ref, 'dependabot/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MAX_GH_PAGES_COMMITS: 25
          # `git commit-tree` runs in a FRESH clone under $RUNNER_TEMP, which
          # has no local identity, and the runner has no global one — so it
          # died with `fatal: empty ident name`. Found by the real-git test,
          # which is the point of running the real block instead of pinning it.
          #
          # Set explicitly rather than via `git config --global`: the identity
          # then belongs to this step, cannot be perturbed by an earlier step,
          # and the commit is attributable to the bot that made it.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          TIP_ERR="${RUNNER_TEMP}/gh-pages-tip-err"
          if ! TIP=$(gh api "repos/${REPO}/git/ref/heads/gh-pages" --jq '.object.sha' 2>"$TIP_ERR"); then
            if grep -q "HTTP 404" "$TIP_ERR"; then
              echo "gh-pages does not exist yet — nothing to cap"
              exit 0
            fi
            cat "$TIP_ERR"
            echo "::error::failed to read the gh-pages tip"
            exit 1
          fi
          # Every LATER API failure (count, tree read, create, re-read, move)
          # already aborts via set -e; the ERR trap makes each one surface as
          # a loud ::error:: annotation too (the guarded read above is exempt
          # from ERR by bash if-condition semantics — its 404 path stays
          # tolerated).
          trap 'echo "::error::gh-pages history cap failed unexpectedly"' ERR
          # O(1) commit count: with per_page=1 the Link header's rel="last"
          # page number IS the total count (absent header = single commit).
          # The first sed slices the RESPONSE HEADERS (everything before the
          # first blank line) so the JSON body can never satisfy the pattern.
          HEADERS=$(gh api -i "repos/${REPO}/commits?sha=gh-pages&per_page=1")
          COUNT=$(printf '%s\n' "$HEADERS" | sed -n '1,/^\r\{0,1\}$/p' | sed -n 's/.*[?&]page=\([0-9][0-9]*\)>; rel="last".*/\1/p' | head -n 1)
          COUNT="${COUNT:-1}"
          echo "gh-pages history: ${COUNT} commit(s); cap threshold: ${MAX_GH_PAGES_COMMITS}"
          if [ "$COUNT" -le "$MAX_GH_PAGES_COMMITS" ]; then
            exit 0
          fi
          # Atomic move. `--force-with-lease=<ref>:<expected>` makes the SERVER
          # reject the update unless gh-pages is still $TIP, so there is no
          # window between checking and moving. A plain re-read + PATCH had one,
          # and a publisher landing inside it was overwritten silently.
          WORK="${RUNNER_TEMP}/gh-pages-cap"
          rm -rf "$WORK"
          git clone --quiet --no-checkout --filter=blob:none --depth=1 \
            --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$WORK"

          # The orphan is built LOCALLY, not through the Git Data API.
          #
          # An API-created commit exists only on the server and is referenced by
          # no ref, so a `--depth=1` clone does not contain it — and `git push
          # <oid>:<ref>` has to READ the object to build the pack. Reproduced
          # against a real transport: `fatal: bad object`, then
          # `! [remote rejected] … (unpacker error)`. That stderr contains
          # `[remote rejected]`, not `[rejected]`, so it would not have matched
          # the lost-race branch either — the step would have failed loudly on
          # the first capped run and every run after, while never capping.
          #
          # `--filter=blob:none` omits blobs but keeps trees, so `HEAD^{tree}`
          # is present. Omitting the parent list is what truncates the history.
          # This also deletes two API calls.
          NEW=$(git -C "$WORK" commit-tree "HEAD^{tree}" \
            -m "chore(gh-pages): cap deploy history — content-identical orphan rebuild of ${TIP} (SHY-0128)")

          # An EMPTY $NEW makes the refspec below `:refs/heads/gh-pages`, which
          # is git's spelling of DELETE THE BRANCH — every report ever
          # published, gone, from a step whose job is to save space. `set -e`
          # already aborts if commit-tree exits non-zero, so this only fires if
          # it somehow succeeds with no output; the consequence is severe
          # enough that "can't happen" is not a good enough reason to omit it.
          if [ -z "$NEW" ]; then
            echo "::error::commit-tree produced no SHA — refusing to push an empty refspec"
            exit 1
          fi

          CAP_ERR="${RUNNER_TEMP}/gh-pages-cap-err"
          if git -C "$WORK" push --quiet \
               --force-with-lease="refs/heads/gh-pages:${TIP}" \
               origin "${NEW}:refs/heads/gh-pages" 2>"$CAP_ERR"; then
            echo "capped gh-pages: ${COUNT} commits -> 1 (tree unchanged)"
          elif grep -qiE 'stale info|non-fast-forward|! \[rejected\]' "$CAP_ERR"; then
            # Someone published while we were building the orphan. Their report
            # is intact, which is the whole point; a later run caps again.
            echo "tip moved since the count — skipping cap this run (a later run retries)"
          else
            cat "$CAP_ERR" >&2
            echo "::error::gh-pages history cap failed for a reason other than a lost race"
            exit 1
          fi

      - name: Post report URL in summary
        if: steps.check-existing.outputs.skip != 'true'
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          {
            echo "## Allure Report (${{ inputs.suite_name }})"
            echo ""
            echo "[View Report](https://${OWNER}.github.io/${REPO##*/}/${{ inputs.suite_name }}/${{ inputs.report_env }}/latest/)"
          } >> "$GITHUB_STEP_SUMMARY"
