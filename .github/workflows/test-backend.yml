name: Test Backend

# Per-ref concurrency: newer commit on the same PR cancels in-progress
# backend-test runs. See lint.yml for the full rationale. Pinned by
# express-api/tests/scripts/reusable-workflow-concurrency.test.js.
concurrency:
  group: test-backend-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out'
        type: string
        required: true
      report_env:
        description: 'Report environment: pr or deploy'
        type: string
        default: 'pr'

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test (default: main)'
        type: string
        default: 'main'
      report_env:
        description: 'Report environment: pr or deploy'
        type: string
        default: 'pr'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    # 15 (was 10) to absorb the first cold-cache Firebase-emulator boot
    # added below for EPIC-0003 Phase 3 (real-firebase Jest tests).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-node
        with:
          cache: 'npm'

      # The Firestore + RTDB emulators are JVM-based, so a JDK must be
      # present before they start. Reuses the repo-wide SHA pin for
      # actions/setup-java (see .github/actions/setup-jdk-gradle) to
      # satisfy the SHA-pin supply-chain guard.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # EPIC-0003 / SHY-0120: provision the REAL R2 (MinIO) + email
      # (Mailpit) backends the cron Jest tests exercise (expireDataExports,
      # rotateLogs, orphanedStorage, backups, accountDeletion). Without
      # these their beforeAll fails on a MinIO/Mailpit connection refusal.
      # Same action the playwright/e2e/integration workflows use; mirrors
      # local/docker-compose (MinIO 9002→9000 minioadmin; Mailpit 1025/8025).
      # Started before the Firebase emulators so the image pulls overlap
      # with emulator boot.
      - uses: ./.github/actions/start-local-services

      # EPIC-0003 Phase 3: provision the REAL Firebase emulator stack
      # (Auth/Firestore/RTDB under projectId demo-shytalk — $0,
      # credential-free) so the express Jest suite runs against real
      # services instead of jest.mock(firebase). Caches emulator JARs.
      - uses: ./.github/actions/start-firebase-emulators

      # Block until MinIO + Mailpit answer before running the suite — the
      # cron tests hit both in beforeAll, so an unready container is a hard
      # failure, not a flake.
      - name: Wait for MinIO + Mailpit to be ready
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9002/minio/health/live >/dev/null \
               && curl -sf http://localhost:8025/api/v1/messages >/dev/null; then
              echo "MinIO + Mailpit ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO/Mailpit did not become ready within 60s"
          exit 1

      - name: Run Express API tests with coverage
        # `--experimental-vm-modules` lets Jest's CJS VM resolve dynamic
        # `import()` callbacks — required since data-export-builder.js uses
        # `import('archiver')` (archiver v8 is ESM-only). Mirrors the
        # `test` script in express-api/package.json.
        run: |
          cd express-api && npm ci
          node --experimental-vm-modules node_modules/.bin/jest --coverage --coverageReporters=html --forceExit

      - name: Write metadata.json
        if: always()
        env:
          REPORT_ENV: ${{ inputs.report_env || 'pr' }}
        run: |
          PASSED=$(grep -oP '"numPassedTests":\K\d+' express-api/coverage/coverage-summary.json 2>/dev/null || echo 0)
          FAILED=$(grep -oP '"numFailedTests":\K\d+' express-api/coverage/coverage-summary.json 2>/dev/null || echo 0)
          TOTAL=$((PASSED + FAILED))
          DATE=$(date +%Y-%m-%d)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          mkdir -p express-api/coverage
          echo "{\"passed\":${PASSED},\"failed\":${FAILED},\"total\":${TOTAL},\"date\":\"${DATE}\",\"runUrl\":\"${RUN_URL}\",\"suite\":\"express\",\"env\":\"${REPORT_ENV}\"}" > express-api/coverage/metadata.json

      # SHY-0298: handed to a separate publish job rather than pushed from here,
      # so a slow or retrying publish cannot hold the backend suite open. An
      # artifact is the hand-off.
      - name: Upload Express report for publishing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: express-report-pages-${{ inputs.report_env || 'pr' }}
          retention-days: 1
          path: express-api/coverage
          if-no-files-found: error

  # SHY-0298 — PR branches get their report back.
  #
  # The old step skipped publishing unless report_env was dev or prod. That was
  # AVOIDANCE, not a fix: the race (peaceiris clones --depth=1, commits, pushes,
  # never retries; N-1 concurrent pushes rejected non-fast-forward — verified on
  # PR #901) was dodged by switching the PR-branch report OFF, on the grounds
  # that it was "nice-to-have". The publish action now RETRIES against the
  # moving tip, so a lost race costs a second attempt rather than a report, and
  # the report comes back — which is also the only externally observable proof
  # that the retry works.
  #
  # NO concurrency group, deliberately. The first version of this story used
  # one, and that was wrong: a group holds exactly ONE pending entry, so a
  # third contender cancels the pending second (incidents #568/#570), and a
  # cancelled publish here propagates into PR Gate, a REQUIRED check — the lock
  # would have red-gated innocent PRs.
  publish-express-report:
    name: Publish Express Report
    needs: test-backend
    # NOT `always()` — see pr-checks.yml's publish job for the full reasoning.
    # `always()` also fires when the run is CANCELLED, and this workflow sits
    # under `cancel-in-progress: true`; the producer's own `if: always()` upload
    # step still runs during cancellation, so the artifact can hold a
    # HALF-FINISHED coverage report, which keep_files:false would publish over
    # the good one. The `skipped` guard is defensive here (this job's producer
    # is the workflow's own main job) but keeps the two publishers identical.
    #
    # A FAILED suite still publishes: that is the case a report matters most.
    if: ${{ !cancelled() && needs.test-backend.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A publish failure must NOT red-gate the PR (SHY-0298 Error-paths AC:
    # "a publishing failure must not be reported as a test failure").
    #
    # This job lives inside a REUSABLE workflow, and a reusable workflow's
    # conclusion is the aggregate of its jobs — so without this, a green
    # backend suite whose report failed to publish made the caller's
    # `test-backend` job `failure`, and `test-backend` is in PR Gate's `needs`.
    # A missing coverage HTML would have blocked a merge with no test failure
    # behind it.
    #
    # `continue-on-error` and NOT a moved job: `test-backend.yml` is also
    # `workflow_dispatch`-able for dev/prod report runs, and moving the publish
    # into pr-checks.yml (where the Kotlin one lives, naturally outside the
    # gate) would silently stop those from publishing.
    #
    # Visibility is unaffected — the job still reports as failed, with the
    # publish action's own `::error` annotation. It just stops being a gate.
    continue-on-error: true
    # NO concurrency group — see pr-checks.yml's publish job. A cancelled job
    # here would be worse than there: this workflow is in PR Gate's `needs`, so
    # a cancelled publish would otherwise fail a REQUIRED check on an innocent
    # PR.
    permissions:
      contents: write
    steps:
      # Same ref as this workflow's own main job, so the publish uses the
      # composite action from the commit under test, not whatever the merge
      # ref resolves to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: express-report-pages-${{ inputs.report_env || 'pr' }}
          path: express-api/coverage
      - uses: ./.github/actions/publish-gh-pages
        with:
          publish-dir: express-api/coverage
          destination-dir: express/${{ inputs.report_env || 'pr' }}/latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
