<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShyTalk Gauntlet</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b36;
        --text: #e6e9ef;
        --dim: #8b93a4;
        --pass: #3fb950;
        --fail: #f85149;
        --run: #d29922;
        --pend: #3d444f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7f9;
          --panel: #fff;
          --line: #e1e4e9;
          --text: #12151a;
          --dim: #5f6775;
          --pend: #d6dae1;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          system-ui,
          sans-serif;
        padding: 20px;
      }
      h1 {
        font-size: 17px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .sub {
        color: var(--dim);
        font-size: 12px;
        margin-top: 3px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .badge {
        padding: 4px 11px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge.running {
        background: rgba(210, 153, 34, 0.16);
        color: var(--run);
      }
      .badge.done {
        background: rgba(63, 185, 80, 0.16);
        color: var(--pass);
      }
      .badge.failed,
      .badge.died {
        background: rgba(248, 81, 73, 0.16);
        color: var(--fail);
      }
      .badge.no-run {
        background: var(--pend);
        color: var(--dim);
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      .bar {
        height: 8px;
        border-radius: 999px;
        background: var(--pend);
        overflow: hidden;
        display: flex;
      }
      .bar i {
        display: block;
        height: 100%;
      }
      .bar .p {
        background: var(--pass);
      }
      .bar .f {
        background: var(--fail);
      }
      .stats {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .stat b {
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        display: block;
        line-height: 1.1;
      }
      .stat span {
        font-size: 11px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .cells {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 8px;
      }
      .cell {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 13px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: var(--pend);
      }
      .cell.passed .dot {
        background: var(--pass);
      }
      .cell.failed .dot {
        background: var(--fail);
      }
      .cell.skipped .dot {
        background: var(--dim);
        box-shadow: inset 0 0 0 2px var(--bg);
      }
      .cell.skipped .name {
        color: var(--dim);
      }
      .cell.running .dot {
        background: var(--run);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      .cell .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cell .meta {
        color: var(--dim);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .cell.pending .name {
        color: var(--dim);
      }
      .tag {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(248, 81, 73, 0.16);
        color: var(--fail);
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--dim);
        margin: 0 0 10px;
      }
      pre {
        margin: 0;
        max-height: 260px;
        overflow: auto;
        font:
          11.5px/1.5 'SF Mono',
          ui-monospace,
          monospace;
        color: var(--dim);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .devs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .dev {
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
      }
      .dev.off {
        color: var(--fail);
        border-color: rgba(248, 81, 73, 0.4);
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>ShyTalk Gauntlet</h1>
        <div class="sub" id="sub">connecting…</div>
      </div>
      <div class="badge no-run" id="state">—</div>
    </header>

    <div class="panel">
      <div class="bar">
        <i class="p" id="barPass" style="width: 0%"></i
        ><i class="f" id="barFail" style="width: 0%"></i>
      </div>
      <div class="stats">
        <div class="stat"><b id="cPass">0</b><span>passed</span></div>
        <div class="stat"><b id="cFail">0</b><span>failed</span></div>
        <div class="stat"><b id="cSkip">0</b><span>skipped</span></div>
        <div class="stat"><b id="cRun">0</b><span>running</span></div>
        <div class="stat"><b id="cPend">0</b><span>to&nbsp;do</span></div>
        <div class="stat"><b id="cPct">0%</b><span>complete</span></div>
        <div class="stat"><b id="cElapsed">—</b><span>elapsed</span></div>
      </div>
    </div>

    <div class="panel">
      <h2>Devices</h2>
      <div class="devs" id="devs"></div>
    </div>

    <div class="panel">
      <h2>Matrix cells</h2>
      <div class="cells" id="cells"></div>
    </div>

    <div class="panel">
      <h2>Recent output</h2>
      <pre id="log">waiting for a run…</pre>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]);

      function renderDevices(d) {
        const parts = [];
        if (d.android && d.android.length) {
          d.android.forEach((s) => parts.push(`<div class="dev">📱 Android ${esc(s)}</div>`));
        } else {
          parts.push('<div class="dev off">📱 no Android device</div>');
        }
        if (d.ios && d.ios.length) {
          d.ios.forEach((s) => parts.push(`<div class="dev">🍎 ${esc(s)}</div>`));
        } else {
          parts.push('<div class="dev off">🍎 no iOS device</div>');
        }
        $('devs').innerHTML = parts.join('');
      }

      function render(s) {
        $('state').className = 'badge ' + s.state;
        $('state').textContent = s.state === 'no-run' ? 'no run' : s.state;
        $('sub').textContent = s.runId ? `${s.runId} · ${s.runDir}` : 'no gauntlet run found yet';

        const c = s.counts || { passed: 0, failed: 0, running: 0, pending: 0, total: 0 };
        $('cPass').textContent = c.passed;
        $('cFail').textContent = c.failed;
        $('cSkip').textContent = c.skipped || 0;
        $('cRun').textContent = c.running;
        $('cPend').textContent = c.pending;
        $('cPct').textContent = (s.percent || 0) + '%';
        $('cElapsed').textContent = s.elapsed || '—';

        const total = c.total || 1;
        $('barPass').style.width = (c.passed / total) * 100 + '%';
        $('barFail').style.width = (c.failed / total) * 100 + '%';

        $('cells').innerHTML = (s.cells || [])
          .map((cell) => {
            const dur = cell.durationMs ? Math.round(cell.durationMs / 1000) + 's' : '';
            const meta =
              cell.state === 'pending'
                ? 'queued'
                : cell.outcome
                  ? `${cell.outcome} ${dur}`
                  : 'running…';
            const tag = cell.unplanned ? '<span class="tag">unplanned</span>' : '';
            return `<div class="cell ${cell.state}"><i class="dot"></i><span class="name">${esc(cell.browser)}</span>${tag}<span class="meta">${esc(meta)}</span></div>`;
          })
          .join('');

        renderDevices(s.devices || {});
        $('log').textContent = s.log || '(no output yet)';
      }

      async function tick() {
        try {
          const res = await fetch('/api/progress');
          render(await res.json());
        } catch {
          $('sub').textContent = 'progress server unreachable — the gauntlet itself is unaffected';
        }
      }
      tick();
      setInterval(tick, 3000);
    </script>
  </body>
</html>
