services:
  livekit:
    image: livekit/livekit-server:v1.12.0
    # Resource diet 2026-05-21: cap to 256m. livekit-server is a Go
    # binary, ~50-100MB steady-state. The cap prevents balloon under
    # peer-connection spikes during voice-room test scenarios. Pinned
    # by tests/scripts/local-stack-resource-diet.test.js.
    #
    # memswap_limit equals mem_limit so Docker disables swap for this
    # container. Without this, Docker's default doubles the effective
    # memory to mem_limit + mem_limit-of-swap, silently degrading host
    # performance under spike instead of failing loud at the cap.
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882"
      - "52000-52100:52000-52100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    # NODE_IP is the address LiveKit ADVERTISES to clients in its ICE
    # candidates (SHY-0273). Left unset, it auto-detects the container's own
    # bridge address (172.18.0.2), which no phone can reach by any route — so
    # signalling connects, ICE never completes, and the room dies with
    # "Broken pipe / Reconnecting". `local/start.sh` sets this to the host's
    # LAN IP so a real device on the same Wi-Fi can reach the published
    # UDP/TCP media ports directly.
    environment:
      NODE_IP: ${LIVEKIT_NODE_IP:-}
    command: --config /etc/livekit.yaml

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    # MinIO pages recent blocks; 512m is generous for fixture-sized
    # objects in tests. memswap_limit pinned equal to disable swap.
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  mailpit:
    image: axllent/mailpit:v1.30.1
    # Tiny in-memory SMTP sink. memswap_limit pinned equal to disable
    # swap (no balloon possible).
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "1025:1025"
      - "8025:8025"
